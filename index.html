<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спроси! — вопросы и ответы</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Golos+Text:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--blue:#005FFF;--blue-d:#0047C7;--orange:#FF8A00;--line:#DFE7F2;--txt:#16202E;--mut:#6B7A90}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Golos Text',sans-serif;color:var(--txt);background:#F1F4F9;
    background-image:radial-gradient(rgba(0,95,255,.06) 1px,transparent 1.4px);background-size:22px 22px}
  button{font-family:inherit;cursor:pointer;border:none}
  input,textarea{font-family:inherit;font-size:14px}

  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .h-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--txt)}
  .logo i{width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;
    font-style:normal;font-family:'Unbounded';font-size:18px;transition:transform .25s}
  .logo:hover i{transform:rotate(-10deg)}
  .logo b{font-family:'Unbounded';font-size:19px}
  .logo b span{color:var(--orange)}
  #search{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;outline:none;transition:.2s}
  #search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,95,255,.12)}

  .login-btn{background:var(--blue);color:#fff;font-weight:700;font-size:13.5px;padding:8px 18px;border-radius:99px;transition:.2s;white-space:nowrap}
  .login-btn:hover{background:var(--blue-d);transform:translateY(-1px)}
  .me-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:99px;
    padding:4px 12px 4px 5px;transition:.2s;white-space:nowrap}
  .me-chip:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,95,255,.12)}
  .chip-ava{width:28px;height:28px;border-radius:50%;background:#EEF4FD;display:grid;place-items:center;font-size:15px}
  .chip-name{font-weight:700;font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
  .chip-karma{font-size:12px;font-weight:800;color:var(--orange)}

  main{max-width:760px;margin:20px auto;padding:0 16px 50px;display:flex;flex-direction:column;gap:14px}
  .ask-toggle{align-self:flex-start;background:var(--orange);color:#fff;font-weight:800;font-size:14.5px;
    padding:11px 22px;border-radius:11px;box-shadow:0 5px 14px rgba(255,138,0,.35);transition:.2s}
  .ask-toggle:hover{transform:translateY(-2px);background:#E67C00}

  .card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;transition:.2s}
  .qcard:hover{border-color:rgba(0,95,255,.35);box-shadow:0 8px 20px rgba(15,35,80,.07)}
  .qcard.fresh{animation:glow 2.5s ease-out}
  @keyframes glow{0%{box-shadow:0 0 0 3px rgba(0,95,255,.4)}100%{box-shadow:0 0 0 3px rgba(0,95,255,0)}}
  #askForm{display:none}
  #askForm.open{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;transition:.2s}
  .field input:focus,.field textarea:focus{border-color:var(--blue)}
  .field textarea{min-height:70px;resize:vertical}
  .btn{background:var(--blue);color:#fff;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:9px;transition:.2s}
  .btn:hover{background:var(--blue-d);transform:translateY(-1px)}
  .btn.big{width:100%;padding:12px;font-size:14.5px;margin-top:6px}

  .q{display:flex;gap:13px}
  .vc{display:flex;flex-direction:column;align-items:center;gap:1px;background:#F4F7FC;border-radius:10px;
    padding:7px 5px;min-width:44px;height:fit-content}
  .vc button{width:28px;height:24px;border-radius:7px;color:#9AA7BC;font-size:11px;transition:.15s;background:none}
  .vc button:hover{background:#E4ECF8;color:var(--blue);transform:scale(1.1)}
  .vc button.on-up{color:var(--orange);background:rgba(255,138,0,.14)}
  .vc button.on-down{color:#5C7CFA;background:rgba(92,124,250,.14)}
  .vc .sc{font-size:14.5px;font-weight:800}
  .sc.pop{animation:pop .3s}
  @keyframes pop{40%{transform:scale(1.35);color:var(--orange)}}

  .q-main{flex:1;min-width:0}
  .q-title{font-size:16.5px;font-weight:700;line-height:1.35}
  .q-body{font-size:13.5px;color:#42506B;line-height:1.55;margin-top:4px}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
  .meta .pava{font-size:15px}
  .meta .name{font-weight:700;color:var(--txt)}
  .rank{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px}
  .ans-btn{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--blue);background:rgba(0,95,255,.08);
    padding:5px 11px;border-radius:8px;transition:.15s}
  .ans-btn:hover{background:rgba(0,95,255,.16)}

  .answers{display:none;margin-top:12px;border-top:1.5px dashed var(--line);padding-top:12px}
  .qcard.open .answers{display:block;animation:fade .25s}
  .a{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .a p{font-size:13.5px;line-height:1.5;color:#33415C}
  .a .vc{min-width:36px;padding:5px 4px}
  .a .vc button{width:24px;height:20px;font-size:9px}
  .a .vc .sc{font-size:12px}
  .a-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .a-form input{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;outline:none;transition:.2s}
  .a-form input:focus{border-color:var(--blue)}

  .empty{text-align:center;padding:44px 16px;color:var(--mut);border:1px dashed var(--line);border-radius:13px;background:#fff}
  .empty b{display:block;font-size:32px;margin-bottom:8px}

  .overlay{position:fixed;inset:0;background:rgba(13,25,45,.55);z-index:100;display:none;place-items:center;padding:20px}
  .overlay.show{display:grid}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:22px;animation:fade .25s}
  .m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .m-head h3{font-family:'Unbounded';font-size:17px}
  .m-head button{width:32px;height:32px;border-radius:9px;color:var(--mut);font-size:15px;transition:.15s}
  .m-head button:hover{background:#F0F4FB;color:var(--txt)}
  .auth-tabs{display:flex;gap:6px;background:#F1F4F9;padding:4px;border-radius:10px;margin-bottom:14px}
  .atab{flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut);transition:.15s}
  .atab.active{background:#fff;color:var(--blue);box-shadow:0 2px 6px rgba(15,35,80,.1)}
  .ava-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .ava-opt{font-size:19px;padding:6px 0;border-radius:9px;border:1.5px solid transparent;background:#F4F7FC;transition:.15s}
  .ava-opt:hover{transform:scale(1.15)}
  .ava-opt.sel{border-color:var(--blue);background:rgba(0,95,255,.1)}
  .divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .g-btn{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px;font-weight:700;
    font-size:13.5px;transition:.2s;display:flex;align-items:center;justify-content:center;gap:9px}
  .g-btn:hover{border-color:#4285F4;transform:translateY(-1px)}
  .g-logo{font-weight:800;font-size:16px;color:#4285F4}
  .danger{width:100%;background:none;color:#C92A2A;font-weight:700;font-size:13px;padding:9px;border-radius:9px;margin-top:8px;transition:.15s}
  .danger:hover{background:#FFF0F0}

  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:#16202E;color:#fff;
    font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:11px;transition:transform .35s;z-index:200;max-width:90vw;text-align:center}
  #toast.show{transform:translate(-50%,0)}
  footer{text-align:center;padding:22px;color:var(--mut);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="h-in">
    <a class="logo" href="#"><i>?</i><b>Спроси<span>!</span></b></a>
    <input id="search" type="text" placeholder="Поиск вопросов…" oninput="state.q=this.value.toLowerCase();render()">
    <div id="authArea"></div>
  </div>
</header>

<main>
  <button class="ask-toggle" onclick="toggleAsk()">✏️ Задать вопрос</button>

  <div class="card" id="askForm">
    <div class="field"><label>Заголовок вопроса</label><input id="fTitle" maxlength="120" placeholder="Кратко и по делу"></div>
    <div class="field"><label>Подробности</label><textarea id="fText" placeholder="Опишите проблему…"></textarea></div>
    <button class="btn" onclick="askQuestion()">Опубликовать</button>
  </div>

  <div id="feed" style="display:flex;flex-direction:column;gap:14px"></div>
</main>

<!-- Вход / Регистрация -->
<div class="overlay" id="authOverlay" onclick="if(event.target===this)closeAuth()">
  <div class="modal">
    <div class="m-head"><h3 id="authTitle">Вход</h3><button onclick="closeAuth()">✕</button></div>
    <div class="auth-tabs">
      <button class="atab active" id="tabLogin" onclick="switchAuth('login')">Вход</button>
      <button class="atab" id="tabSignup" onclick="switchAuth('signup')">Регистрация</button>
    </div>
    <div id="signupFields">
      <div class="field"><label>Имя</label><input id="aName" placeholder="Как вас зовут"></div>
      <div class="field"><label>Аватар</label><div class="ava-grid" id="authAvaGrid"></div></div>
    </div>
    <div class="field"><label>Email</label><input id="aEmail" type="email" placeholder="you@mail.ru"></div>
    <div class="field"><label>Пароль</label><input id="aPass" type="password" placeholder="Минимум 6 символов"></div>
    <button class="btn big" id="authBtn" onclick="doAuth()">Войти</button>
    <div class="divider">или</div>
    <button class="g-btn" onclick="googleAuth()"><span class="g-logo">G</span> Продолжить с Google</button>
  </div>
</div>

<!-- Профиль -->
<div class="overlay" id="profOverlay" onclick="if(event.target===this)closeProfile()">
  <div class="modal">
    <div class="m-head"><h3>Мой профиль</h3><button onclick="closeProfile()">✕</button></div>
    <div class="field"><label>Имя</label><input id="pName"></div>
    <div class="field"><label>Аватар</label><div class="ava-grid" id="profAvaGrid"></div></div>
    <button class="btn big" onclick="saveProfile()">Сохранить</button>
    <button class="danger" onclick="logout()">Выйти из аккаунта</button>
  </div>
</div>

<footer>Спроси! · голосуй честно — один голос на человека</footer>
<div id="toast"></div>

<script>
/* ===== КЛЮЧИ SUPABASE ===== */
const SUPABASE_URL = 'https://yxgwxdyvsjeudlaflwbk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7GEQDJ593o2NjU_eBvJRvw_LYf95f5h';
const sb = (SUPABASE_URL && window.supabase) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const AVATARS = ['🙂','😎','🤓','😈','🐱','🐶','🦊','🐼','🐸','🦄','🐯','👾','🤖','👻','🔥','🌚'];
const RANKS = [
  {name:'Салага',min:0,icon:'🐣',c:'#7D8CA3'}, {name:'Ученик',min:50,icon:'📘',c:'#005FFF'},
  {name:'Знаток',min:200,icon:'🔎',c:'#0891B2'}, {name:'Мудрец',min:800,icon:'🦉',c:'#16A34A'},
  {name:'Просветлённый',min:2000,icon:'🌟',c:'#D97706'}, {name:'Гуру',min:5000,icon:'🔥',c:'#EA580C'},
  {name:'Оракул',min:12000,icon:'🔮',c:'#9333EA'}, {name:'Легенда',min:30000,icon:'👑',c:'#DC2626'},
];
const rankOf = k => [...RANKS].reverse().find(r=>k>=r.min) || RANKS[0];
const rankBadge = k => { const r=rankOf(k);
  return `<span class="rank" style="color:${r.c};background:${r.c}14;border:1px solid ${r.c}33">${r.icon} ${r.name}</span>`; };

let DATA = {questions:[],answers:[],profiles:[],myVotes:[]};
let session = null, authMode = 'login';
const state = {q:''};
const openSet = new Set();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const plural = (n,f)=>f[n%10===1&&n%100!==11?0:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?1:2];
const timeAgo = iso => { const m=Math.floor((Date.now()-new Date(iso))/60000);
  return m<1?'только что':m<60?m+' мин назад':m<1440?Math.floor(m/60)+' ч назад':Math.floor(m/1440)+' дн назад'; };
const profileOf = uid => DATA.profiles.find(p=>p.id===uid) || {name:'Аноним',avatar:'🙂'};
function postKarma(p){
  const src=[...DATA.questions,...DATA.answers];
  const list = p.author_id ? src.filter(x=>x.author_id===p.author_id)
                           : src.filter(x=>!x.author_id && x.author===p.author);
  return list.reduce((s,x)=>s+x.votes,0);
}
const myKarma = () => session ? [...DATA.questions,...DATA.answers]
  .filter(p=>p.author_id===session.user.id).reduce((s,p)=>s+p.votes,0) : 0;
const myVote = (type,id) => { const v=DATA.myVotes.find(v=>v.target_type===type&&v.target_id===id); return v?v.value:0; };

/* ===== Загрузка ===== */
async function loadAll(){
  if(!sb) return;
  const [q,a,p] = await Promise.all([
    sb.from('questions').select('*').order('created_at',{ascending:false}),
    sb.from('answers').select('*'),
    sb.from('profiles').select('*')
  ]);
  DATA.questions=q.data||[]; DATA.answers=a.data||[]; DATA.profiles=p.data||[];
  if(session){
    const v = await sb.from('votes').select('target_type,target_id,value').eq('user_id',session.user.id);
    DATA.myVotes = v.data||[];
  } else DATA.myVotes=[];
}

/* ===== Отрисовка ===== */
function authorHTML(p){
  const prof = p.author_id ? profileOf(p.author_id) : {name:p.author,avatar:'🙂'};
  return `<span class="pava">${prof.avatar}</span><span class="name">${esc(prof.name)}</span>${rankBadge(postKarma(p))}<span>${timeAgo(p.created_at)}</span>`;
}
function voteCol(type,id,votes,small){
  const mv = myVote(type,id);
  return `<div class="vc${small?' small':''}">
    <button class="${mv===1?'on-up':''}" onclick="vote('${type}',${id},1)">▲</button>
    <div class="sc">${votes}</div>
    <button class="${mv===-1?'on-down':''}" onclick="vote('${type}',${id},-1)">▼</button>
  </div>`;
}
function ansHTML(a){
  return `<div class="a">${voteCol('a',a.id,a.votes,true)}
    <div style="flex:1;min-width:0"><p>${esc(a.body)}</p>
    <div class="meta" style="margin-top:6px">${authorHTML(a)}</div></div></div>`;
}
function cardHTML(q){
  const ans = DATA.answers.filter(a=>a.question_id===q.id).sort((a,b)=>b.votes-a.votes);
  return `<article class="card qcard${openSet.has(q.id)?' open':''}" data-id="${q.id}">
    <div class="q">${voteCol('q',q.id,q.votes)}
      <div class="q-main">
        <div class="q-title">${esc(q.title)}</div>
        <div class="q-body">${esc(q.body)}</div>
        <div class="meta">${authorHTML(q)}
          <button class="ans-btn" id="tg-${q.id}" onclick="toggleAns(${q.id})">💬 ${ans.length} ${plural(ans.length,['ответ','ответа','ответов'])} ▾</button>
        </div>
        <div class="answers">
          ${ans.map(a=>ansHTML(a)).join('')}
          <div class="a-form">
            <input id="at-${q.id}" placeholder="Ваш ответ…">
            <button class="btn" onclick="sendAnswer(${q.id})">Ответить</button>
          </div>
        </div>
      </div></div></article>`;
}
function renderAuthArea(){
  const el=document.getElementById('authArea');
  if(!session){ el.innerHTML=`<button class="login-btn" onclick="openAuth('login')">Войти</button>`; return; }
  const p=profileOf(session.user.id);
  el.innerHTML=`<button class="me-chip" onclick="openProfile()">
    <span class="chip-ava">${p.avatar}</span><span class="chip-name">${esc(p.name)}</span>
    <span class="chip-karma">⚡ ${myKarma()}</span></button>`;
}
function render(){
  renderAuthArea();
  const feed=document.getElementById('feed');
  if(!sb){ feed.innerHTML='<div class="empty"><b>⚙️</b>Supabase не подключён — вставьте ключи в код.</div>'; return; }
  const list = DATA.questions
    .filter(q=>(q.title+' '+q.body).toLowerCase().includes(state.q))
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  feed.innerHTML = list.length ? list.map(cardHTML).join('')
    : '<div class="empty"><b>👋</b>Пока пусто! Будьте первым — задайте вопрос.</div>';
  openSet.forEach(id=>{ const t=document.getElementById('tg-'+id);
    if(t){ const n=DATA.answers.filter(a=>a.question_id===id).length;
      t.innerHTML=`💬 ${n} ${plural(n,['ответ','ответа','ответов'])} ▴`; }});
}

/* ===== Голосование (1 голос на человека) ===== */
async function vote(type,id,val){
  if(!session){ openAuth('login'); toast('Войдите, чтобы голосовать'); return; }
  const uid=session.user.id, tbl=type==='q'?'questions':'answers';
  const post=(type==='q'?DATA.questions:DATA.answers).find(x=>x.id===id);
  const mine=myVote(type,id);
  try{
    if(mine===0){
      await sb.from('votes').insert({user_id:uid,target_type:type,target_id:id,value:val});
      await sb.from(tbl).update({votes:post.votes+val}).eq('id',id);
    } else if(mine===val){
      await sb.from('votes').delete().match({user_id:uid,target_type:type,target_id:id});
      await sb.from(tbl).update({votes:post.votes-val}).eq('id',id);
    } else {
      await sb.from('votes').update({value:val}).match({user_id:uid,target_type:type,target_id:id});
      await sb.from(tbl).update({votes:post.votes+val*2}).eq('id',id);
    }
    await loadAll(); render();
  }catch(e){ toast('Ошибка голосования: '+e.message); }
}

/* ===== Вопросы и ответы ===== */
function toggleAns(id){
  const card=document.querySelector(`.qcard[data-id="${id}"]`);
  const open=card.classList.toggle('open');
  open?openSet.add(id):openSet.delete(id);
  const n=DATA.answers.filter(a=>a.question_id===id).length;
  document.getElementById('tg-'+id).innerHTML=`💬 ${n} ${plural(n,['ответ','ответа','ответов'])} ${open?'▴':'▾'}`;
}
function toggleAsk(){
  if(!session){ openAuth('login'); toast('Войдите, чтобы задать вопрос'); return; }
  document.getElementById('askForm').classList.toggle('open');
}
async function askQuestion(){
  if(!session){ openAuth('login'); return; }
  const t=fTitle.value.trim(), b=fText.value.trim();
  if(!t||!b){ toast('Заполните заголовок и текст'); return; }
  const prof=profileOf(session.user.id);
  const {error}=await sb.from('questions').insert({title:t,body:b,author:prof.name,author_id:session.user.id,votes:0});
  if(error){ toast('Ошибка: '+error.message); return; }
  fTitle.value=fText.value='';
  document.getElementById('askForm').classList.remove('open');
  await loadAll(); render(); toast('Вопрос опубликован! 🎉');
  const c=document.querySelector('.qcard'); if(c) c.classList.add('fresh');
}
async function sendAnswer(qid){
  if(!session){ openAuth('login'); toast('Войдите, чтобы отвечать'); return; }
  const text=document.getElementById('at-'+qid).value.trim();
  if(!text){ toast('Напишите текст ответа'); return; }
  const prof=profileOf(session.user.id);
  const {error}=await sb.from('answers').insert({question_id:qid,body:text,author:prof.name,author_id:session.user.id,votes:0});
  if(error){ toast('Ошибка: '+error.message); return; }
  openSet.add(qid); await loadAll(); render(); toast('Ответ добавлен!');
}

/* ===== Авторизация ===== */
const avaGridHTML = sel => AVATARS.map(a=>`<button type="button" class="ava-opt${a===sel?' sel':''}" onclick="pickAva(this)">${a}</button>`).join('');
function pickAva(btn){
  btn.parentElement.querySelectorAll('.ava-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
const gridVal = id => { const s=document.querySelector('#'+id+' .ava-opt.sel'); return s?s.textContent:'🙂'; };

function openAuth(mode){
  authMode=mode; switchAuth(mode);
  document.getElementById('authAvaGrid').innerHTML=avaGridHTML('🙂');
  document.getElementById('authOverlay').classList.add('show');
}
function closeAuth(){ document.getElementById('authOverlay').classList.remove('show'); }
function switchAuth(mode){
  authMode=mode;
  document.getElementById('signupFields').style.display = mode==='signup'?'block':'none';
  document.getElementById('tabLogin').classList.toggle('active',mode==='login');
  document.getElementById('tabSignup').classList.toggle('active',mode==='signup');
  document.getElementById('authTitle').textContent = mode==='signup'?'Регистрация':'Вход';
  document.getElementById('authBtn').textContent = mode==='signup'?'Создать аккаунт':'Войти';
}
async function doAuth(){
  const email=aEmail.value.trim(), pass=aPass.value;
  if(!email.includes('@')){ toast('Введите корректный email'); return; }
  if(pass.length<6){ toast('Пароль — минимум 6 символов'); return; }
  if(authMode==='signup'){
    const name=aName.value.trim()||'Аноним', avatar=gridVal('authAvaGrid');
    const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name,avatar}}});
    if(error){ toast(error.message); return; }
    if(!data.session){ toast('Проверьте почту — нужно подтвердить email ✉️'); return; }
  } else {
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){ toast('Неверный email или пароль'); return; }
  }
}
async function googleAuth(){
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});
  if(error) toast('Google-вход ещё не настроен — см. инструкцию ниже');
}
async function ensureProfile(user){
  const {data:ex}=await sb.from('profiles').select('id').eq('id',user.id).maybeSingle();
  if(!ex){
    const m=user.user_metadata||{};
    await sb.from('profiles').insert({id:user.id,name:m.name||m.full_name||'Аноним',avatar:m.avatar||'🙂'});
  }
}
async function logout(){
  await sb.auth.signOut(); closeProfile(); toast('Вы вышли из аккаунта');
}

/* ===== Профиль ===== */
function openProfile(){
  if(!session) return;
  const p=profileOf(session.user.id);
  document.getElementById('pName').value=p.name;
  document.getElementById('profAvaGrid').innerHTML=avaGridHTML(p.avatar);
  document.getElementById('profOverlay').classList.add('show');
}
function closeProfile(){ document.getElementById('profOverlay').classList.remove('show'); }
async function saveProfile(){
  const name=document.getElementById('pName').value.trim()||'Аноним';
  const avatar=gridVal('profAvaGrid');
  await sb.from('profiles').update({name,avatar}).eq('id',session.user.id);
  closeProfile(); await loadAll(); render(); toast('Профиль сохранён ✅');
}

/* ===== Служебное ===== */
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2800); }

if(sb){
  sb.auth.onAuthStateChange(async (event,s)=>{
    session=s;
    if(session) await ensureProfile(session.user);
    await loadAll(); render();
    if(session) closeAuth();
  });
  sb.auth.getSession().then(async ({data})=>{
    session=data.session;
    if(session) await ensureProfile(session.user);
    await loadAll(); render();
  });
} else render();
</script>
